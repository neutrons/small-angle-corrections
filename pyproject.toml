[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "small-angle-corrections"
version = "0.1.0"
description = "Post-processing corrections (multiple scattering, desmearing) for small-angle neutron and X-ray scattering data"
keywords = [
    "small-angle scattering",
    "SANS",
    "SAXS",
    "USANS",
    "multiple scattering",
    "desmearing",
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "ORNL USANS Team"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
small-angle-corrections = "small_angle_corrections.cli:main"

[project.urls]
Homepage = "https://github.com/yrshang/small-angle-corrections"
Repository = "https://github.com/yrshang/small-angle-corrections"

[tool.setuptools.packages.find]
where = ["src"]
