[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usans-correct"
version = "0.1.0"
description = "Post-processing correction framework for USANS/SANS data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "ORNL USANS Team"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
usans-correct = "usans_correct.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
